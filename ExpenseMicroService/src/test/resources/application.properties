spring.application.name=expense-service-test
spring.threads.virtual.enabled=true

# H2 In-Memory Database with MySQL compatibility mode and DATE_FORMAT alias
spring.datasource.url=jdbc:h2:mem:spendy_expense;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;INIT=CREATE ALIAS IF NOT EXISTS DATE_FORMAT FOR 'com.spendyteam.expense.Utility.H2FunctionAliases.dateFormat'
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Flyway Schema Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JWT Keys for testing
jwt.issuer=spendy-auth
jwt.audience=spendy-app
jwt.public-key-location=classpath:keys/public_key.pem
