server.address=0.0.0.0
server.port=8080
spring.application.name=coinquylife-gateway

# Auth Service
spring.cloud.gateway.routes[0].id=coinquylifeauth
spring.cloud.gateway.routes[0].uri=http://auth-service:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/Auth/**
spring.cloud.gateway.routes[0].filters[0]=RewritePath=/Auth/(?<segment>.*), /$\{segment}

# Expense Service
spring.cloud.gateway.routes[1].id=ExpenseMicroService
spring.cloud.gateway.routes[1].uri=http://expense-service:8084
spring.cloud.gateway.routes[1].predicates[0]=Path=/Expense/**
spring.cloud.gateway.routes[1].filters[0]=RewritePath=/Expense/(?<segment>.*), /$\{segment}

# Token
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty.http.client=DEBUG
