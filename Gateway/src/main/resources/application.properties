server.address=0.0.0.0
server.port=7860
spring.application.name=Gateway
spring.threads.virtual.enabled=true

# Auth Service
spring.cloud.gateway.routes[0].id=AuthMicroService
spring.cloud.gateway.routes[0].uri=${AUTH_SERVICE_URI:http://localhost:8081}
spring.cloud.gateway.routes[0].predicates[0]=Path=/Auth/**
spring.cloud.gateway.routes[0].filters[0]=RewritePath=/Auth/(?<segment>.*), /$\{segment}

# Expense Service
spring.cloud.gateway.routes[1].id=ExpenseMicroService
spring.cloud.gateway.routes[1].uri=${EXPENSE_SERVICE_URI:http://localhost:8084}
spring.cloud.gateway.routes[1].predicates[0]=Path=/Expense/**
spring.cloud.gateway.routes[1].filters[0]=RewritePath=/Expense/(?<segment>.*), /$\{segment}

# Deduplicate CORS headers from downstream services
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
spring.cloud.gateway.default-filters[1]=RemoveRequestHeader=X-Auth-User

# JWT RS256 Public Key / Secrets Configuration
jwt.issuer=${JWT_ISSUER:spendy-auth}
jwt.audience=${JWT_AUDIENCE:spendy-app}
jwt.public-key-location=${JWT_PUBLIC_KEY_LOCATION:}
jwt.public-key=${JWT_PUBLIC_KEY:}
jwt.jwk-set-uri=${JWT_JWK_SET_URI:}

# Logging Configuration
logging.level.root=INFO
logging.level.org.springframework.cloud.gateway=INFO
logging.level.org.springframework.http.server.reactive=INFO
logging.level.reactor.netty=INFO
logging.level.reactor.netty.http.client=ERROR

# Access Logs
reactor.netty.http.server.accessLogEnabled=true
logging.level.reactor.netty.http.server.AccessLog=INFO

# OpenAPI / Swagger UI Aggregated Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls[0].name=API Gateway
springdoc.swagger-ui.urls[0].url=/v3/api-docs
springdoc.swagger-ui.urls[1].name=Auth Service
springdoc.swagger-ui.urls[1].url=/Auth/v3/api-docs
springdoc.swagger-ui.urls[2].name=Expense Service
springdoc.swagger-ui.urls[2].url=/Expense/v3/api-docs
springdoc.swagger-ui.operationsSorter=method