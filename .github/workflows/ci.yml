name: CI - Build, Test and Verify

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Validate shell scripts, MySQL init order, and Compose config
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_PASSWORD: ci-shared-password
        run: |
          bash -n scripts/dev-up.sh scripts/smoke-test.sh
          sh -n db/init/99-init-users.sh
          test "$(find db/init -maxdepth 1 -type f | sort | head -n 1)" = "db/init/00-init-db.sql"
          test "$(find db/init -maxdepth 1 -type f | sort | tail -n 1)" = "db/init/99-init-users.sh"
          docker compose config --quiet

      - name: Build and Test with Maven
        run: mvn clean verify -B

      - name: Upload Surefire Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-reports
          path: '**/target/surefire-reports/'
          if-no-files-found: warn
          retention-days: 14

      - name: Upload JaCoCo Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-reports
          path: '**/target/site/jacoco/'
          if-no-files-found: warn
          retention-days: 14
