spring.application.name=auth-service
spring.threads.virtual.enabled=true
server.port=8081

# MySQL Datasource Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE_AUTH:spendy_auth}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway Schema Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

logging.level.org.springframework.security=${LOGGING_LEVEL_SECURITY:INFO}

# OpenAPI / Swagger UI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# JWT RS256 Secrets Configuration
jwt.issuer=${JWT_ISSUER:spendy-auth}
jwt.audience=${JWT_AUDIENCE:spendy-app}
jwt.expiration=${JWT_EXPIRATION:900000}
jwt.private-key=${JWT_PRIVATE_KEY:}
jwt.public-key=${JWT_PUBLIC_KEY:}
jwt.private-key-location=${JWT_PRIVATE_KEY_LOCATION:}
jwt.public-key-location=${JWT_PUBLIC_KEY_LOCATION:}
jwt.allow-ephemeral-keys=${JWT_ALLOW_EPHEMERAL_KEYS:false}
jwt.active-key-id=${JWT_ACTIVE_KEY_ID:spendy-auth-key-1}
jwt.previous-public-keys=${JWT_PREVIOUS_PUBLIC_KEYS:}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080,http://localhost:7860,http://127.0.0.1:7860,http://127.0.0.1:8080,http://127.0.0.1:3000,http://localhost:8081,http://127.0.0.1:8081,http://localhost:8084,http://127.0.0.1:8084}
rate.limiting.enabled=${RATE_LIMITING_ENABLED:true}


